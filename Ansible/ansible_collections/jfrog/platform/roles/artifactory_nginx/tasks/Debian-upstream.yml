# Debian 13+: apt-key is removed — use trusted.gpg.d.
# Debian < 13 / Ubuntu: keep apt_key (previous behavior).
# Only one of these two includes runs.
- name: Configure nginx apt repository
  ansible.builtin.include_tasks: "{{ nginx_debian_repo_tasks_file }}"
  vars:
    nginx_debian_repo_tasks_file: >-
      {{ 'Debian-upstream-keyring.yml'
         if (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 13)
         else 'Debian-upstream-aptkey.yml' }}

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: apt_update_cache
  retries: 5
  delay: 60
  until: apt_update_cache is succeeded
