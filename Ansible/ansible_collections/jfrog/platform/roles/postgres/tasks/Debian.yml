- name: Install prerequisite packages
  become: true
  ansible.builtin.apt:
    name: ['acl', 'apt-transport-https', 'ca-certificates', 'locales', 'python3-psycopg2']
    state: present
    update_cache: true

- name: Ensure UTF-8 locale exists
  become: true
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

# Debian 13+: apt-key/gpg are absent — use /etc/apt/keyrings + sources.list copy.
# Debian < 13 / Ubuntu: keep apt_key + apt_repository (previous behavior).
# Only one include runs.
- name: Configure PostgreSQL apt repository
  ansible.builtin.include_tasks: "{{ postgres_debian_repo_tasks_file }}"
  vars:
    postgres_debian_repo_tasks_file: >-
      {{ 'Debian-repo-keyring.yml'
         if (ansible_distribution == 'Debian' and ansible_distribution_major_version | int >= 13)
         else 'Debian-repo-aptkey.yml' }}

- name: Install postgres packages
  become: true
  ansible.builtin.apt:
    name:
      - postgresql-{{ postgres_version }}
      - postgresql-contrib-{{ postgres_version }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: download_postgresql
  until: download_postgresql is success
  retries: 3
  delay: 3
