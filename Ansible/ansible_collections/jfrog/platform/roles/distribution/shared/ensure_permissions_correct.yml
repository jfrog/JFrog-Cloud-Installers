- name: Ensure files ownership are correct
  become: true
  ansible.builtin.command:
    cmd: >-
      find "{{ jfrog_home_directory }}" -xdev
      ( ! -user "{{ distribution_user }}" -o ! -group "{{ distribution_group }}" )
      -print -exec chown -h "{{ distribution_user }}:{{ distribution_group }}" {} +
  register: distribution_ownerships
  changed_when: distribution_ownerships.stdout | length > 0
