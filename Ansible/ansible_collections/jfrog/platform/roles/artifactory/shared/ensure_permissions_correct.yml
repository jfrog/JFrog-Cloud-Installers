- name: Ensure files ownership are correct
  become: true
  ansible.builtin.command:
    cmd: >-
      find "{{ jfrog_home_directory }}" -xdev
      ( ! -user "{{ artifactory_user }}" -o ! -group "{{ artifactory_group }}" )
      -print -exec chown -h "{{ artifactory_user }}:{{ artifactory_group }}" {} +
  register: artifactory_ownerships
  changed_when: artifactory_ownerships.stdout | length > 0
